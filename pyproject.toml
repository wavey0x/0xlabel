[project]
name = "0xtagger"
version = "1"
description = "A small self-hosted address book for the 0xtagger Chrome extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wavey0x" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
0xtagger = "server:main"

[project.urls]
Source = "https://github.com/wavey0x/0xtagger"
Issues = "https://github.com/wavey0x/0xtagger/issues"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
