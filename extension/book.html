<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Address book · 0xlabel</title><link rel="stylesheet" href="colors.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="book.css"></head>
<body>
  <main class="book">
    <header class="book-header"><h1 class="brand" aria-label="0xlabel"><img class="brand-mark" src="icons/mark.svg" alt="0x">label</h1>
      <div class="connection-line">
        <button id="location" aria-label="Address book" aria-haspopup="menu" aria-expanded="false" popovertarget="location-menu"><span>On this device</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        <div id="location-menu" popover role="menu" aria-label="Your address books"></div>
        <button id="book-settings" class="quiet icon" aria-label="Address book settings" title="Address book settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 4h4m3 0h5M2 8h8m3 0h1M2 12h1m3 0h8"/><circle cx="7.5" cy="4" r="1.5"/><circle cx="11.5" cy="8" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/></svg></button>
        <button id="refresh" class="quiet icon" aria-label="Sync address book" title="Sync address book"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5a5.5 5.5 0 1 0 .3 5M13 2v3H10"/></svg></button>
      </div>
    </header>
    <section class="book-heading"><div><h2>Address book</h2><p id="count" class="muted"></p></div><button id="add-address" class="primary">+ Add address</button></section>
    <section class="panel book-panel">
      <div class="book-tools"><input id="search" type="search" aria-label="Search address book" placeholder="Search tags or addresses" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" autofocus><button id="import" class="quiet">Import</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="export" class="quiet">Export book</button></div>
      <div class="table-scroll"><table><thead><tr><th>Tags</th><th>Address</th><th><span class="sr-only">Copy address</span></th></tr></thead><tbody id="results"></tbody></table></div>
      <div id="empty"><p></p></div>
    </section>
    <footer class="book-footer"><span id="sync" class="muted" role="status"></span></footer>
    <p id="message" class="message" role="status"></p>
  </main>
  <dialog id="server" class="panel" aria-label="New address book"></dialog>
  <dialog id="manage-dialog" class="panel" aria-labelledby="manage-heading">
    <header class="view-heading"><h2 id="manage-heading">Address book settings</h2><button id="close-manage" type="button" class="quiet icon" aria-label="Close settings">×</button></header>
    <form id="manage-form" novalidate>
      <label for="book-rename">Name</label>
      <input id="book-rename" maxlength="40" autocomplete="off">
      <p id="manage-error" class="message" role="alert"></p>
      <footer class="form-actions"><button id="remove-book" type="button" class="quiet icon danger" aria-label="Remove this address book"></button><span class="spacer"></span><button id="cancel-manage" type="button" class="quiet">Cancel</button><button id="save-manage" type="submit" class="primary">Save</button></footer>
    </form>
    <div id="remove-confirm" hidden>
      <p id="remove-copy"></p>
      <footer class="form-actions"><span class="spacer"></span><button id="keep-book" type="button" class="quiet">Cancel</button><button id="confirm-remove" type="button" class="primary danger">Remove</button></footer>
    </div>
  </dialog>
  <dialog id="add-dialog" class="panel" aria-labelledby="add-heading">
    <header class="view-heading"><h2 id="add-heading">Add address</h2><button id="close-add" type="button" class="quiet icon" aria-label="Close address entry">×</button></header>
    <form id="manual-form" novalidate>
      <label for="manual-address">Address</label><input id="manual-address" type="search" role="textbox" placeholder="Paste a full 0x address" autocomplete="off" spellcheck="false" data-bwignore="true">
      <label for="network">Chain ID <span class="muted">(optional)</span></label><input id="network" inputmode="numeric" autocomplete="off" placeholder="All networks">
      <p id="address-error" class="message" role="alert"></p>
      <footer class="form-actions"><button id="cancel-add" type="button" class="quiet">Cancel</button><button type="submit" class="primary">Add tags</button></footer>
    </form>
  </dialog>
  <div id="editor-host"></div>
  <script type="module" src="book.js"></script>
</body></html>
