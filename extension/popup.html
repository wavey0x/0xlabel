<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xlabel</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1><span>0x</span>label</h1><button id="settings-toggle" class="quiet" aria-label="Connection settings">Connections</button></header>
  <div class="connection-line"><select id="connection" aria-label="Active connection"><option value="">Add a connection</option></select><button id="refresh" class="quiet" aria-label="Refresh selected book">↻</button></div>
  <p id="sync" class="muted"></p>
  <section id="settings" hidden>
    <form id="connection-form">
      <label>Connection details<textarea id="pairing" rows="2" placeholder='Paste the JSON printed by your helper'></textarea></label>
      <div class="divider">or enter them below</div>
      <label>API address<input id="api-url" type="url" placeholder="http://127.0.0.1:8712" required></label>
      <label>Access token<input id="token" type="password" autocomplete="off" placeholder="Leave blank to keep a saved token"></label>
      <label>Name<input id="name" maxlength="50" placeholder="Local or Remote"></label>
      <p class="muted">A different API address creates a separate book. Connecting only downloads it.</p>
      <button id="connect" class="primary" type="submit">Connect</button>
    </form>
  </section>
  <section class="site">
    <div class="site-line"><div class="site-info"><span id="site-name">This website</span><span id="site-view" class="muted">Website defaults</span></div><button id="site-toggle" class="site-switch" role="switch" aria-checked="false" aria-label="Show my labels on this site" aria-describedby="site-name"><span></span></button></div>
    <div id="adapter-warning" hidden><p></p><button id="retry" class="quiet">Retry</button><button id="disable" class="quiet">Turn off for this site</button></div>
  </section>
  <label>Your book<input id="search" type="search" placeholder="Search names or paste a full address" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"></label>
  <div id="results"></div>
  <p id="empty" class="muted"></p>
  <form id="manual-form"><input id="manual-address" aria-label="Full wallet address" placeholder="0x… full address" required><input id="network" aria-label="Optional chain ID" inputmode="numeric" placeholder="Chain ID (optional)"><button type="submit" class="quiet">Label address</button></form>
  <footer><button id="export" class="quiet">Export this book</button><span id="count" class="muted"></span></footer>
  <p id="message" role="status"></p>
  <div id="editor-host" hidden></div>
  <script type="module" src="popup.js"></script>
</body></html>
