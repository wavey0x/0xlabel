<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xlabel</title><link rel="stylesheet" href="colors.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <section id="home">
      <header class="view-heading"><h1 class="brand" aria-label="0xlabel"><img class="brand-mark" src="icons/mark.svg" alt="0x">label</h1><button id="settings-toggle" class="quiet icon" aria-label="Connection settings" title="Connection settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 4h4m3 0h5M2 8h8m3 0h1M2 12h1m3 0h8"/><circle cx="7.5" cy="4" r="1.5"/><circle cx="11.5" cy="8" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/></svg></button></header>
      <span class="eyebrow">Address book</span>
      <div class="connection-line">
        <button id="connection" aria-label="Active connection" aria-haspopup="menu" aria-expanded="false" popovertarget="connection-menu"><span>Connect a book</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        <div id="connection-menu" popover role="menu" aria-label="Connections"></div>
        <button id="refresh" class="quiet icon" aria-label="Sync address book" title="Sync address book"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5a5.5 5.5 0 1 0 .3 5M13 2v3H10"/></svg></button>
      </div>
      <p id="sync" class="muted" role="status"></p>
      <section class="site">
        <div class="site-info"><span class="eyebrow">On this website</span><strong id="site-name">No website open</strong></div>
        <button id="site-toggle" class="switch" role="switch" aria-checked="false" aria-label="Show my tags on this website" aria-describedby="site-name"><span></span></button>
      </section>
      <div id="adapter-warning" hidden><p></p><button id="retry" class="quiet">Retry</button><button id="disable" class="quiet">Turn off</button></div>
      <button id="open-book" class="open-book quiet">Open address book <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 8-8M4 4h8v8"/></svg></button>
    </section>
    <section id="settings" hidden></section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
