<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xlabel</title><link rel="stylesheet" href="colors.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <section id="home">
      <header class="view-heading"><h1 class="brand" aria-label="0xlabel"><img class="brand-mark" src="icons/mark.svg" alt="0x">label</h1></header>
      <span class="eyebrow">Address book</span>
      <div class="connection-line">
        <button id="location" aria-label="Where your book is kept" aria-haspopup="menu" aria-expanded="false" popovertarget="location-menu"><span>On this device</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        <div id="location-menu" popover role="menu" aria-label="Where to keep your book"></div>
      </div>
      <p id="sync" class="muted" role="status"></p>
      <section class="site">
        <div class="site-info"><span class="eyebrow">On this website</span><strong id="site-name">No website open</strong></div>
        <button id="site-toggle" class="switch" role="switch" aria-checked="false" aria-label="Show my tags on this website" aria-describedby="site-name"><span></span></button>
      </section>
      <div id="adapter-warning" hidden><p></p><button id="retry" class="quiet">Retry</button><button id="disable" class="quiet">Turn off</button></div>
      <button id="open-book" class="open-book quiet">Open address book <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 8-8M4 4h8v8"/></svg></button>
    </section>
    <section id="server" class="panel" hidden></section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
